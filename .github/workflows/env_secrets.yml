name: Demo CI Env Sercrets

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install
        env:
          APP_ENV: demo
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: echo "ENV $APP_ENV, DB_PASSWORD - $DB_PASSWORD"
