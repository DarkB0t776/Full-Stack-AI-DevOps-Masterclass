name: Demo CI Env Sercrets

on:
#  push:
#    branches:
#      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install
        env:
          APP_ENV: demo
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: echo "ENV $APP_ENV, DB_PASSWORD - $DB_PASSWORD"

      - name: Create demo file
        run: |
          echo echo "Create demo file" > demo.txt
          echo "File create successfully"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-artifact-demo
          path: .

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Test
        run: echo "Running tests..."
