name: Tax Calculator App CI/CD to AWS EKS

on:
  workflow_dispatch:
  push:
    branches:
      - working
    paths:
      - docker/app2-tax-calculator/**

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [service-a, service-b]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Bulid and Test (Maven) ${{ matrix.service }}
        working-directory: docker/app2-tax-calculator/spring/${{ matrix.service }}
        run: mvn -B clean verify

      - name: Upload Test Report ${{ matrix.serivce }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: docker/app2-tax-calculator/spring/${{ matrix.service }}/target/surefire-reports

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-test
    strategy:
      matrix:
        service:
          - {
              name: "service-a",
              docker_name: "tax-service-a",
              path: "docker/app2-tax-calculator/spring/service-a"
            }
          - {
              name: "service-b",
              docker_name: "tax-service-b",
              path: "docker/app2-tax-calculator/spring/service-b"
            }

    steps:
      - name: Checkout Code
        uses: actions/chekcout@v4

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Build JAR for docker
        working-directory: ${{ matrix.service.path }}
        run: mvn -B clean package -DskipTests

      - name: Get next version
        id: version
        uses: reecetech/version-increment@v2026.8.4
        with:
          scheme: semver
          increment: patch 
          
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push to DockerHub
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service.path }}
          push: true
          tags: | 
            ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.service.docker_name }}:${{ steps.version.outputs.version }}
            ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.service.docker_name }}:latest

  deploy-aws-eks:
    runs-on: ubuntu-latest
    needs: docker-build-push

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
      
      - name: Update kubectl config
        run: aws eks update-config --name hello-cluster --region us-east-1

      - name: Verify Connection
        run: kubectl get nodes

      - name: Deploy to AWS (Kubernetes)
        run: |
          kubectl apply -f k8s/aws/app2-tax-calculator/service-a
          kubectl apply -f k8s/aws/app2-tax-calculator/service-b
