name: Hello Spring CI-CD to AWS EKS

on:
  workflow_dispatch:
  push:
    paths:
      - "docker/app1-hello/springboot/hello-spring/**"

env:
  IMAGE_NAME: darkbot776/hello-spring

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Build And Test
        working-directory: docker/app1-hello/springboot/hello-spring
        run: mvn -B clean verify
        
      - name: Upload Test Reports
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: docker/app1-hello/springboot/hello-spring/target/surefire-reports

          
  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Build JAR for Docker
        working-directory: docker/app1-hello/springboot/hello-spring
        run: mvn -B clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with: 
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Docker Image Tag
        id: vars
        run: echo "TAG=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: docker/app1-hello/springboot/hello-spring
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.TAG }}
            ${{ env.IMAGE_NAME }}:latest

  deploy-to-aws-eks:
    runs-on: ubuntu-latest
    needs: docker-build-push
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: mock-key
      AWS_SECRET_ACCESS_KEY: mock-secret
      AWS_DEFAULT_REGION: us-east-1

    services:
      floci:
        image: floci/floci:latest
        ports:
          - 4566:4566

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Verify connection with floci
        run: curl -s http://localhost:4566 || exit 1

      - name: Update kubeconfig for EKS
        run: aws eks update-kubeconfig --name hello-cluster --region us-east-1 --endpoint-url http://localhost:4566

      - name: Check kubectl context
        run: kubectl get nodes

#      - name: Deploy to AWS (Kubernetes)
#        run: echo aws eks create-cluster 
